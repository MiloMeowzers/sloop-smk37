# The SMK-37 port's build and test run (fm1-to-smk37 AGENTS.md steps 1, 5 and 7), on the CI branch only: never
# part of the upstream pull request. One run builds, on the same day (the builds embed __DATE__):
#   1. the baseline: upstream SLOOP 2.8.4 (BASE) for the FM-1, its hashes and its test results
#   2. this branch for the SMK-37 Pro, Elite and MKE (one package each)
#   3. this branch for the FM-1, last (the tests read the FM-1 binaries): byte-identical to the baseline, or the run fails
#   4. the host and web tests: no failure that the baseline does not have, or the run fails
# The packages, their SHA-256 and the logs are the run's artifact. Nothing is installed anywhere. On a public repository
# the run also publishes the installer sites (Pro, Elite, MKE) and the editor on GitHub Pages, behind a model picker
# (.github/pages/index.html), once every check above has passed: from the ci branch only (the vocoder branches build
# their package and installer site as the run's artifact; the Pages site is ci's, which builds Mewcoder too).
name: SMK-37 build

on:
  push:
    branches: [ci, uac-in, mewcoder, harmoniser]   # (uac-in: mewcoder on the private repository)
  workflow_dispatch:

# a newer push to the same branch stops the run before it (the owner, 2026-11-11: the private repository's Actions
# minutes; a run is 15-20 minutes. On the public repository the runs are free; development continues there)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # (the vocoder branches: their package only, no Pro / MKE / probes)
  VOC_ONLY: ${{ contains(fromJSON('["uac-in", "mewcoder", "harmoniser"]'), github.ref_name) }}
  BASE: 91f3018                      # SLOOP 2.8.4, the port's upstream base (was d893642, 2.8.1)
  JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
  AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
  SDK_TAG: AC79NN_SDK_V1.2.1_2023-12-13

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0             # the baseline commit and its history

      - name: Host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential python3-venv libraqm0 xz-utils curl
          python3 -m venv ~/.venv-fw
          ~/.venv-fw/bin/pip install -q Pillow fonttools
          ~/.venv-fw/bin/python -c "from PIL import features; import sys; ok = features.check('raqm'); print('raqm', ok); sys.exit(0 if ok else 1)"
          echo "$HOME/.venv-fw/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache the JieLi toolchain and SDK files
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-${{ env.SDK_TAG }}-v1

      - name: JieLi toolchain (JieLi's package server)
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh tools/get_toolchain.sh

      - name: AC79 SDK files (gitee, sparse)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch "$SDK_TAG" \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$AC79_SDK"
          git -C "$AC79_SDK" sparse-checkout set cpu/wl82/tools

      - name: Versions
        run: |
          ls "$JIELI_TOOLCHAIN"
          "$JIELI_TOOLCHAIN"/pi32v2/bin/clang --version 2>/dev/null | head -1 || true
          python3 --version; node --version; gcc --version | head -1

      - name: The day (the builds embed __DATE__)
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # the baseline never changes: its test results kept for good, its FM-1 hashes for the day (the date is in the
      # binaries), so a second run the same day builds and tests it no more
      - name: Baseline cache (tests)
        uses: actions/cache@v6
        with:
          path: basecache/tests
          key: base-tests-${{ env.BASE }}

      - name: Baseline cache (FM-1 hashes, the day's)
        uses: actions/cache@v6
        with:
          path: basecache/fm1
          key: base-fm1-${{ env.BASE }}-${{ steps.day.outputs.day }}

      - name: 1. Baseline (upstream ${{ env.BASE }}, FM-1)
        run: |
          if [ -s basecache/fm1/fm1-reference.sha256 ] && [ -s basecache/tests/base-tests.log ]; then
            echo "baseline from the cache"
            cp basecache/fm1/fm1-reference.sha256 ../
            cp basecache/tests/base-tests.log basecache/tests/base-fails.txt ../
            cat ../fm1-reference.sha256
            echo "baseline failures: $(wc -l < ../base-fails.txt)"
            exit 0
          fi
          git worktree add ../base "$BASE"
          cd ../base
          sh build.sh > ../base-build.log 2>&1 || { tail -50 ../base-build.log; exit 1; }
          sha256sum build/felucca.bin build/felucca.fwsc build/loader/ota.bin > ../fm1-reference.sha256
          cat ../fm1-reference.sha256
          if [ -s "$GITHUB_WORKSPACE/basecache/tests/base-tests.log" ]; then
            cp "$GITHUB_WORKSPACE"/basecache/tests/base-tests.log "$GITHUB_WORKSPACE"/basecache/tests/base-fails.txt ../
          else
            sh tests/run_tests.sh > ../base-tests.log 2>&1 || true
            # (regress prints timing-only measurements as "-- timed: a note, not a failure": listed apart, never a
            # failure; their numbers differ on every run of a shared runner)
            grep -E "FAIL|OVER BUDGET" ../base-tests.log | grep -v "a note, not a failure" | sort -u > ../base-fails.txt || true
            mkdir -p "$GITHUB_WORKSPACE/basecache/tests"
            cp ../base-tests.log ../base-fails.txt "$GITHUB_WORKSPACE/basecache/tests/"
          fi
          mkdir -p "$GITHUB_WORKSPACE/basecache/fm1"
          cp ../fm1-reference.sha256 "$GITHUB_WORKSPACE/basecache/fm1/"
          echo "baseline failures: $(wc -l < ../base-fails.txt)"

      - name: 2. SMK-37 packages (Pro, Elite, MKE)
        run: |
          mkdir -p out
          if [ "$VOC_ONLY" != true ]; then
          for m in pro elite mke; do
            BOARD=smk37 MODEL=$m sh build.sh > "out/build-smk37-$m.log" 2>&1 || { tail -50 "out/build-smk37-$m.log"; exit 1; }
            p=build/sloop-smk37$( [ $m = pro ] || echo "-$m" ).fwsc     # (the intermediates are shared: copy each at once)
            cp "$p" out/
          done
          # a console build of the Elite package for the device bring-up (fm1-to-smk37 docs/03, section 7: smk, padtest,
          # leds): the USB serial console built in (FELUCCA_CDC=1, out of the normal builds since 2.7) and on from the
          # start (FELUCCA_CDC_ON=1); the same identity. For testing only: the normal package goes back on after
          BOARD=smk37 MODEL=elite FELUCCA_CDC=1 FELUCCA_CDC_ON=1 sh build.sh > out/build-smk37-elite-console.log 2>&1 ||
            { tail -50 out/build-smk37-elite-console.log; exit 1; }
          cp build/sloop-smk37-elite.fwsc out/sloop-smk37-elite-console.fwsc
          gzip -9c build/felucca.dis > out/felucca-console.dis.gz     # (where the flash goes: the vocoder build's against it)
          tail -3 out/build-smk37-elite-console.log
          # the stems probe (smk37-port.yaml follow_up.stems first_tests): the console build with the USB audio input
          # as 6 x 24 bit at 48 kHz and test signals instead of the music (SMK_UAC_PROBE=1). For testing only
          BOARD=smk37 MODEL=elite FELUCCA_CDC=1 FELUCCA_CDC_ON=1 SMK_UAC_PROBE=1 sh build.sh > out/build-smk37-elite-uac6.log 2>&1 ||
            { tail -50 out/build-smk37-elite-uac6.log; exit 1; }
          cp build/sloop-smk37-elite.fwsc out/sloop-smk37-elite-uac6probe.fwsc
          tail -3 out/build-smk37-elite-uac6.log
          # the playback probe (smk37-devtools README, "Candidate"): the stems probe plus audio from the computer on
          # EP4 OUT, looped back on stems 4 and 5 and played on the headphones (SMK_UAC_IN_PROBE=1). For testing only
          BOARD=smk37 MODEL=elite FELUCCA_CDC=1 FELUCCA_CDC_ON=1 SMK_UAC_PROBE=1 SMK_UAC_IN_PROBE=1 sh build.sh \
            > out/build-smk37-elite-uin.log 2>&1 || { tail -50 out/build-smk37-elite-uin.log; exit 1; }
          cp build/sloop-smk37-elite.fwsc out/sloop-smk37-elite-uinprobe.fwsc
          tail -3 out/build-smk37-elite-uin.log
          fi
          # the vocoder build: the playback input and HOME > VOCODER on the console build, SLOOP's USB audio as usual
          # (no test signals: USB LAYOUT stereo or the stems), lean (SMK_VOC_LEAN: smk37-devtools vocoder-ui-spec.md
          # §1: no built-in samples, TEXTURE or five engines; SLICE on user samples; the delay at 22.05 kHz)
          BOARD=smk37 MODEL=elite FELUCCA_CDC=1 FELUCCA_CDC_ON=1 SMK_UAC_IN_PROBE=1 SMK_VOC_LEAN=1 FELUCCA_SLICE=1 sh build.sh \
            > out/build-smk37-elite-voc.log 2>&1 || { tail -50 out/build-smk37-elite-voc.log; exit 1; }
          cp build/sloop-smk37-elite.fwsc out/sloop-smk37-elite-vocoder.fwsc
          gzip -9c build/felucca.dis > out/felucca-vocoder.dis.gz
          tail -3 out/build-smk37-elite-voc.log
          ls -l out/*.fwsc

      - name: SHA-256 of the packages
        run: |
          (cd out && sha256sum *.fwsc | tee packages.sha256)

      - name: Installer sites, one per model (for a local, offline install)
        run: |
          # web/make_site.py: the installer with its package (checked by its SHA-256 in the page) and the editor,
          # also as one file for the disk (webapp/editor/sloop-editor.html). The installer fetches its package, so
          # it is served from localhost (serve-installer.ps1), not opened as a file
          v="2.8.1-smk37-$(git rev-parse --short HEAD)"
          if [ "$VOC_ONLY" = true ]; then      # (the vocoder branch: its own package's site and editor)
            python3 web/make_site.py out/sloop-smk37-elite-vocoder.fwsc "$v" out/installer-elite > /dev/null
            mkdir -p out/installer-pro/webapp/editor
            cp out/installer-elite/webapp/editor/sloop-editor.html out/installer-pro/webapp/editor/
          else
          for m in pro elite mke; do
            p=out/sloop-smk37$( [ $m = pro ] || echo "-$m" ).fwsc
            python3 web/make_site.py "$p" "$v" "out/installer-$m" > /dev/null
            ls "out/installer-$m/webapp/installer/index.html" "out/installer-$m/firmware/"*.fwsc
          done
          fi
          cp .github/serve-installer.ps1 out/
          mkdir -p out/tools        # the backup prep and the installer (Python 3 with mido and python-rtmidi)
          cp tools/smk_backup_prep.py tools/fm1_install.py out/tools/
          # the editor of this branch, one file for the disk (the same for every model): open it in Chrome / Edge
          cp out/installer-pro/webapp/editor/sloop-editor.html "out/sloop-editor-$v.html"

      - name: 3. FM-1, byte-identical to the baseline
        run: |
          sh build.sh > out/build-fm1.log 2>&1 || { tail -50 out/build-fm1.log; exit 1; }
          sha256sum -c ../fm1-reference.sha256 | tee out/fm1-identical.txt

      - name: 4. Host and web tests (FM-1 built last)
        run: |
          sh tests/run_tests.sh > out/tests.log 2>&1 || true
          grep -E "FAIL|OVER BUDGET" out/tests.log | grep -v "a note, not a failure" | sort -u > out/fails.txt || true
          grep "a note, not a failure" out/tests.log > out/timing-notes.txt || true
          echo "timing notes (not failures): $(wc -l < out/timing-notes.txt)"; cat out/timing-notes.txt
          cp ../base-fails.txt ../base-tests.log ../fm1-reference.sha256 out/
          comm -13 ../base-fails.txt out/fails.txt > out/new-fails.txt
          echo "failures: $(wc -l < out/fails.txt), baseline: $(wc -l < ../base-fails.txt), new: $(wc -l < out/new-fails.txt)"
          if [ -s out/new-fails.txt ]; then echo "NEW FAILURES:"; cat out/new-fails.txt; exit 1; fi

      - name: Artifact (packages, SHA-256, logs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sloop-smk37-${{ github.sha }}
          path: out/
          retention-days: 30

      - name: The Pages site (the model picker, an installer site per model; public repository only)
        if: ${{ !github.event.repository.private && github.ref_name == 'ci' }}
        run: |
          mkdir -p pages
          for m in pro elite mke; do cp -r "out/installer-$m" "pages/$m"; done
          v="2.8.1-smk37-$(git rev-parse --short HEAD)"
          sed "s|<footer>BUILD</footer>|<footer>Build $v</footer>|" .github/pages/index.html > pages/index.html
          touch pages/.nojekyll

      - name: Upload the Pages site
        if: ${{ !github.event.repository.private && github.ref_name == 'ci' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

  pages:                             # (deployed only after the build, the FM-1 identity and the tests have passed)
    if: ${{ !github.event.repository.private && github.ref_name == 'ci' }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
