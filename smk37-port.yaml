# smk37-port.yaml: every decision for this SMK-37 port of SLOOP, in one place.
# Filled from the owner's answers (fm1-to-smk37 AGENTS.md, step 0). Change this file first, then the code.
# The mapping is the existing SLOOP SMK-37 port's (fm1-to-smk37 examples/sloop.yaml), carried to SLOOP 2.8.1.

firmware:
  name: SLOOP
  upstream: https://github.com/isod89/sloop-fm1
  base: SLOOP 2.8.1 (d893642)
  family: sloop
  board_layer: sloop        # genkigenki/sloop-fm1 smk37 (= isod89/sloop-fm1#112): 8fad1a1..ref/smk37, on 2.6; that
                            # branch already merged upstream 2.7 (ba54ba5), so 2.8 / 2.8.1 are the new ground
  lost_on_smk: [TRS MIDI IN / MIDI clock in over TRS]   # MIDI OUT on the TRS jack stays
  priorities:
    - user sample kits and banks from the web editor work as on the FM-1 (USR1..USR4, the big kit USR3+4)
    - the SLOOP workflow unchanged, so the SLOOP manual still applies (2.8's NOTES editor and per-step sheet too)
    - step sequencing on the pads, in the screen's track colours
    - quick sound choice without menus
    - a hands-on mixer for the four tracks

delivery:
  mode: local               # prepared on the local branch smk37 only: no push, fork, PR or release until the owner
                            # has talked to genkigenki; PR text drafted for later (upstream PR is the intended end)
  pr: ""
  fork: ""
  package: sloop-smk37.fwsc # sloop-smk37-elite.fwsc, sloop-smk37-mke.fwsc
  usb_name: Felucca         # SLOOP's USB product string (kept); installers already know it
  data_family: SLOOP        # shared with genkigenki's SLOOP SMK-37 build; settings layouts 2.7 -> 2.8.1 to be
                            # checked byte for byte before relying on it (step 3)
  copyright: ""             # no new porter line: genkigenki's existing lines in the layer's files stay as they are

models: [pro, elite, mke]   # Starrykey 37 Play uses the Pro build

samples:                    # owner's decision (not in the template): keep the FM-1's four-slot arrangement
  layout: 4 x 40 KiB        # USR1..USR4 in the existing FL_SMP window 0xC2000..0xE9FFF (no new flash window, the
                            # allow-list and its asserts unchanged): USR1 0xC2000, USR2 0xCC000, USR3 0xD6000, USR4 0xE0000
  usr1_usr2: instruments / one-shots (SAMPLE, GRAIN, SLICE, texture SRC), and kits, as on the FM-1
  usr3_usr4: two kits, or together the big kit USR3+4 (80 KiB, about 7 s; the FM-1's is about 15 s)
  drum_track: KIT USR1, USR2, USR3, USR4, USR3+4, as on the FM-1
  editor: the web editor sizes everything from SMP_INFO's slot size (no hard-coded 80 KiB); FM-1 unchanged (80 KiB)
  migration: samples stored by the 2.7 SMK build (2 x 80 KiB) read as empty when over 40 KiB; re-upload; told in SMK37.md
  backups: a backup slot bigger than the device's slot is skipped with a message; the rest restores

keys:
  middle: fm1
  outer: extend             # synth tracks: more notes; drum track: drums
  outer_drums:
    C3: kick
    D3: snare
    E3: hi-hat              # a black key plays its left white neighbour
    G#5: cowbell
    A5: open hi-hat
    B5: crash
    C6: ride
  velocity: factory

pads:
  pattern: steps            # the FM-1's 16 white keys F3..G5
  order: reading            # top row steps 1-8, bottom row 9-16
  colours: screen           # track colours: blue, green, yellow, orange
  idle: dark
  playhead: bright
  picker:
    enabled: true
    knob: K4
    page: "< >"
    pin: KNOB BANK
  velocity: true
  notes: SEL layer shows a piano layout (scale green, root brighter); SAVE layer shows slots (used green, free white)

faders:
  pattern: banks
  takeover: soft
  bank_button: FADER BANK
  banks:
    A: [level 1, level 2, level 3, level 4 (drums)]
    B: [filter 1, filter 2, filter 3, filter 4]
    C: [reverb 1, reverb 2, reverb 3, reverb 4]
    D: [delay 1, delay 2, delay 3, delay 4]
  screen: bank_screen

wheels:
  pitch:
    target: bend
    range_semitones: 7
    applies_to: selected
  mod:
    target: vibrato
    detail: 10 Hz, up to +-1 semitone, up = more
  calibration: auto

rules:
  no_doubles: true
  doubles_allowed: []

knobs:
  layout: fm1               # plus the layer's HOME > SCREEN > KNOB LAYOUT = SMK option, kept
  K1: master
  K2: select                # tempo on TRACKS, pages; 2.8.1: on the PUNCH page (FX held) the fade
  K3: track
  K4: sound / kit
  K5: dial 1 (blue)
  K6: dial 2 (green)
  K7: dial 3 (yellow)
  K8: dial 4 (orange)
  step: detent
  pages: {}

buttons:
  map: printed              # PATCH = HOME, CHORD = ENV, NOTE REPEAT = LFO, SCALE = SEL, PARA = EDIT, GLOBE = GLO, BT = SAVE
  names: firmware
  extra:
    KNOB BANK: pins the pad sound picker
    FADER BANK: the fader bank screen
    "<": "page back (SEQ held: step page back; visualiser: style)"
    ">": "page forward (SEQ held: step page forward; visualiser: style)"
  notes: 2.8's NOTES editor and per-step sheet open with OCTAVE+ (the FM-1's OCT+), as the layer maps OCT+ already

screen:
  style: keep
  colours: track colours blue, green, yellow, orange on screen, pads and knob caps K5-K8
  rules:
    - the screen shows what you touch first
    - same colours and same places on screen and panel
    - no hidden modes

punch_midi:                 # owner's decision: SMK-only in this port (behind BOARD_SMK37; FM-1 unchanged)
  in: as upstream 2.7      # GLO > MIDI 3 > FX CH: notes 53..79 hold the punch-in effects (USB MIDI in; no TRS in)
  out: smk only            # a punch-in from the pads / keys (FX held) sends its note on FX CH (USB and TRS MIDI OUT),
                            # note off on release, so a DAW records it and plays it back through FX CH
  default: FX CH OFF        # as upstream: nothing new is sent until FX CH is set

editor:                     # owner's decision: an editor update is part of this port (web/editor.html, web tests)
  - sample slots, kits (USR3+4 split) and backups sized from SMP_INFO's slot size, not a fixed 80 KiB
  - a backup slot larger than the device's slot: skipped with a message, the rest restores
  - the editor's built-in test device can be an SMK (40 KiB slots) so the web tests cover it
  - the FM-1 path unchanged (80 KiB slots); sources only, the published site is left to the maintainer

follow_up:                  # decided and planned, NOT in this port; all of it behind BOARD_SMK37 (built and tested on
                            # the SMK-37 first; offered to isod89 once it works), the FM-1 build byte-identical
  stems:                    # per-track USB audio for a DAW (each track also on its own MIDI channel: exists, GLO > MIDI)
    mode: USB AUDIO LAYOUT = STEREO (default) | DRUMS+RET | SYNTHS+RET | ALL DRY; a switch re-plugs USB (a distinct
          bcdDevice per layout, as Melodee); STEREO is today's path, unchanged
    format: 48 kHz / 24 bit (3-byte samples), every stems layout 6 mono channels (49 x 6 x 3 = 882 B a packet; USB full
            speed allows 1023 - 7 channels at 48/24 do not fit)
    layouts:
      DRUMS+RET:  [KICK, SNARE, HATS, PERC, RET L, RET R]
      SYNTHS+RET: [SYN 1, SYN 2, SYN 3, DRUMS (the whole kit mono, as today's drum track), RET L, RET R]
      ALL DRY:    [SYN 1, SYN 2, SYN 3, KICK, SNARE, HATS+PERC (PERC folded into HATS)]
    groups: the per-kit STEM GROUP of each lane (KICK / SNARE / HATS / PERC); default KICK - KICK, KICK 2 / SNARE - SNARE,
            SNARE 2, CLAP, RIM / HATS - HAT, PEDAL, OPEN HAT, CRASH, RIDE / PERC - LOW TOM, HI TOM, SHAKER, CONGA, COWBELL
    choke: separate from the stem group (applies to the voices before the mix) - folding PERC into HATS in ALL DRY
           changes only the channel, never what chokes what
    synth_tap: post the track's own chain (engine, DIST, INSERT, SLICER, FILTER) and LEVEL / mute / solo; before pan
               and the sends
    return: the shared reverb / delay / chorus wet (stereo), with whatever every track sends to it
    level: the existing USB AUDIO setting is respected - MASTER (the stems follow the knob's smoothed gain, either
           LIMITER curve) or FULL (fixed, as the knob at the top); the stereo output's full scale at -12 dBFS in the
           24-bit stems (12 dB headroom), no limiter / knee on the stems (no pumping baked in, no CPU), only a hard
           ceiling at 24-bit full scale
    shared_fx: one reverb / delay / chorus for all tracks (sends only per track); per-track instances do not fit in RAM
    drum_track_fx: FILTER, INSERT and SLICER GATE per group (exact for the linear ones; 4 groups in DRUMS+RET, 3 in ALL
                   DRY, 1 in SYNTHS+RET); SLICER STUT needs 8 KB a group - per group if the RAM is there, else the kit
                   as one stem while STUT is on
    master: MASTER stage (DJ filter, DUST, TEXTURE, limiter) not on the stems; the metronome not on any stem
    punch: on the selected track in the stems layouts (one ring, as now; four rings do not fit in RAM)
    resampling: 44.1 -> 48 kHz per channel (6 instead of 2), on core 1
    cpu_rule: a layout ships only if its worst case (all tracks, a full kit with the per-group FX, all sends, STUT)
              stays under ~85 % on the unit (console build - cpu1); otherwise it is cut down, not shipped popping
    first_tests: (1) the chip's USB sends 882-byte isochronous packets (today 196 B; Melodee proved 540 B);
                 (2) Windows' class driver (usbaudio.sys) takes 6 ch / 24 bit; then macOS and an iPad
    not_a_factor: isod89/sloop-fm1#99 (Pixel phones record USB audio distorted through Android's normal path) - an
                  Android compatibility issue, not headroom; the stems are for a DAW
    reference: Melodee (Kerem Kilic, keremimo/melodee, GPL-3.0) 4-track capture on the same chip (packets ~540 B work)
  choke:                    # MPC-style, per kit, sharing the per-voice group routing with the stems
    model: per lane CHOKE (OFF / A..D - a hit cuts the sounding voices of its group) and MONO (a new hit cuts its own
           lane); one-way mute targets maybe later
    storage: "built-in kits - a per-kit table on the SMK (46 kits x 16 lanes, 1 byte a lane - stem group, choke, mono;
             a new SMK-only store object, in backups, the FM-1 path skips it). User kits (USR1-4, USR3+4) - IN THE KIT
             itself (decided), so a kit shared through the editor keeps its settings"
    kit_block: "plan - the slot's bytes 480..511 (between the 480-byte header and the data at 512; erased FF on every
               slot today) - a magic, 16 lane bytes, a check; FF (absent) = the defaults, so every existing kit plays as
               now. The FM-1 never reads them (its build unchanged); the editor's kit files, backups and read-back carry
               them; SMP_END (or a new command) gets the 32 bytes on the SMK only, behind the editor's model check"
    editing: "on the keyboard first; later also with the kit in the editor's DRUM KIT page (per lane - STEM GROUP,
             CHOKE, MONO), saved in the kit block"
    channel_names: by role (KICK, SNARE, HATS, PERC, HATS+PERC) - decided; the choke and the intent read at a glance
    defaults: today's sound (only the hat choke - closed / pedal hat cut the open one); the stem groups by lane role
    optimise: "a group with no lane assigned in the current kit costs nothing - no FX chain run, its channel silent;
              STUT buffers only for the groups in use (8 KB each), so most kits fit; only when they do not, the kit
              goes out as one stem while STUT is on. Assignment is free per kit (toms in KICK, perc unused, ...)"
    stut: decided - per group if the RAM is there, else the whole kit as one stem while STUT is on

pedal: none

modes: {}                   # the layer's DAW mode (< + >) is kept as it is

build:
  environment: GitHub Actions (private CI branch `ci`, ubuntu-22.04) - the upstream 2.8.1 baseline, the SMK-37 Pro /
               Elite / MKE packages, the FM-1 again (byte-identical to the baseline), host and web tests in one run

device_tests:               # what was tested on a unit (for the PR text: say exactly this, no more)
  unit: SMK-37 Elite (flash id 0x856014), from M-Vave stock 016
  backup: full flash dump via tools/smk_backup_prep.py prep + jl-uboot-tool, 4 reads (reads 2-4 identical; read 1 one
          weak bit at 0xE0963, in USRFLASH), verified
  install: sloop-smk37-elite.fwsc (5118a03) with the local web installer; identity SMK-37 Elite_900 (fm1_install --info);
           the installer's wait for the restart timed out on Windows' first enumeration (to look at)
  round_1: keys, pads, knobs, faders, wheels, buttons, HOME menu layout, saving - all ok (owner)
  round_2: console build (FELUCCA_CDC=1, cda485b) - status, smk, padtest, leds all as the kit expects; all 16 pads, 4
           faders, both wheels, 18 buttons seen; flr - 0xC0000-0xC1FFF, 0xF4000-0xFDFFF, 0xFF000-0xFFFFF identical to the
           backup after the installs
  round_3: the editor (4033cc7 - 4 x 40 KiB, "about 3.7 s", a USR3+4 big kit sent and played, a chopped break, FM-1
           backup restore); the slot read-back (6b76627, branch editor-slot-readback) - load from the keyboard and the
           pages filled after a restore - ok (owner)
  not_yet: punch-in MIDI out with a DAW; the DAW mode

open_questions:             # to settle next (the owner's call), in this order
  - "Snoop37 look (SNOOP37=1, opt-in; genkigenki's smk37-snoop-look branch: boot splash + jingle, BOOT LOGO setting):
     BOOT LOGO in SCREEN (KNOB ACCEL to SEQ) or in SEQ"
  - "PAD LIGHT (genkigenki's snoop37 branch: LIGHTS K8, pads 100/75/50/25 %): bring it into every SMK build?"
  - "the installer's wait for the keyboard after the write (60 s) timed out on Windows' first enumeration: lengthen it"
